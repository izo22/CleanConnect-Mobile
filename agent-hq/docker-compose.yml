# Orvanta online: the app + Caddy, which gets and renews the HTTPS certificate.
# Fill in .env (copy .env.example), point the domain to this server, then:
#   docker compose up -d --build
services:
  app:
    build: .
    image: agent-hq
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${DOMAIN:?DOMAIN manquant dans .env}
    volumes:
      - agent-hq-data:/data
    expose:
      - "8787"
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      # Public website (optional); a local name keeps Caddy quiet when unset.
      SITE_DOMAIN: ${SITE_DOMAIN:-site.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-hq-data:
  caddy-data:
  caddy-config:

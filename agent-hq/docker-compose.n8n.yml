# Optional: a test n8n on the same server, at https://${N8N_DOMAIN}, to try
# the n8n integration without a paid n8n plan. Point N8N_DOMAIN to this
# server (DNS "A" record), set it in .env, then:
#   docker compose -f docker-compose.yml -f docker-compose.n8n.yml up -d
# Stop it when you are done testing (it uses about 300 MB of memory):
#   docker compose -f docker-compose.yml -f docker-compose.n8n.yml stop n8n
services:
  n8n:
    image: n8nio/n8n:2.44.7
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN:?N8N_DOMAIN manquant dans .env}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - n8n-data:/home/node/.n8n
    expose:
      - "5678"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n-data:
